# =========================================================================
# Nginx da demo de carga (Fase 10).
#
# Responsabilidade: terminar HTTP e repassar para o PHP-FPM. Mantido no
# mínimo absoluto de propósito: nenhum rate limiting no edge (limit_req),
# nenhum cache — o objeto do experimento é o limitador da APLICAÇÃO, e
# qualquer limite aqui contaminaria a medição.
# =========================================================================
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Nginx e PHP-FPM ficam na mesma rede do Compose; o IP de origem real
    # chega via X-Forwarded-For. Para que a chave por IP funcione, a
    # aplicação precisa confiar neste proxy: TRUSTED_PROXIES no .env do
    # serviço app (ver docs/fases/fase-6 e fase-10).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Burst de carga com 40 VUs pode enfileirar; timeouts curtos
        # transformariam fila em erro 504 e sujariam a contagem de 200/429.
        fastcgi_read_timeout 120s;
    }

    # Sem access_log por requisição: em burst de 200 req o I/O de log
    # competiria com a medição.
    access_log off;
    error_log /var/log/nginx/error.log warn;
}
