; =========================================================================
; Pool PHP-FPM da aplicação (Fase 10).
;
; Responsabilidade: fixar a contagem de workers em um valor EXPLÍCITO e
; visível. Este número é a variável independente do experimento da fase:
; com 1 worker as requisições serializam (e o naive não sobre-admite, como
; na Fase 8); com N > 1 elas realmente competem pelo mesmo balde no Redis.
;
; pm = static de propósito: `dynamic` sobe e desce workers conforme a carga,
; o que tornaria a contagem — justamente o que estamos medindo — variável
; durante o teste.
;
; Para testar outra contagem, edite pm.max_children e reconstrua:
;   docker compose --profile http up -d --build
; =========================================================================
[www]
pm = static
pm.max_children = 8

; Erros do PHP visíveis no log do container, para que uma falha de aplicação
; nunca seja confundida com decisão do limitador durante a carga.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
